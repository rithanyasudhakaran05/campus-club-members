<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Club Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #333;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        .member {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .member p {
            margin: 8px 0;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #a71d2a;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Campus Club Members</h1>

    <div class="form-box">

        <h2>Add Member</h2>

        <form id="memberForm">

            <label>Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Department</label>
            <input type="text" id="department" required>

            <label>Year</label>
            <input type="number" id="year" required>

            <label>Club</label>
            <input type="text" id="club" required>

            <button type="submit">Add Member</button>

        </form>

        <p id="message"></p>

    </div>

    <h2>All Members</h2>

    <div id="membersList"></div>

</div>


<script>

    // ADD MEMBER
    document.getElementById("memberForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const memberData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            department: document.getElementById("department").value,
            year: Number(document.getElementById("year").value),
            club: document.getElementById("club").value
        };

        console.log("Sending member:", memberData);

        try {

            const response = await fetch("/members", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(memberData)
            });

            const data = await response.json();

            console.log("Server response:", data);

            if (response.ok) {

                document.getElementById("message").innerText =
                    "Member added successfully!";

                document.getElementById("memberForm").reset();

                loadMembers();

            } else {

                document.getElementById("message").innerText =
                    "Error: " + data.message;

            }

        } catch (error) {

            console.error("Error:", error);

            document.getElementById("message").innerText =
                "Could not connect to server.";

        }

    });


    // LOAD ALL MEMBERS
    async function loadMembers() {

        try {

            const response = await fetch("/members");

            const members = await response.json();

            const membersList =
                document.getElementById("membersList");

            membersList.innerHTML = "";

            members.forEach(function(member) {

                const div = document.createElement("div");

                div.className = "member";

                div.innerHTML = `

                    <p>
                        <strong>Name:</strong>
                        ${member.name}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${member.email || "Not provided"}
                    </p>

                    <p>
                        <strong>Department:</strong>
                        ${member.department || "Not provided"}
                    </p>

                    <p>
                        <strong>Year:</strong>
                        ${member.year || "Not provided"}
                    </p>

                    <p>
                        <strong>Club:</strong>
                        ${member.club || "Not provided"}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteMember('${member._id}')">
                        Delete
                    </button>

                `;

                membersList.appendChild(div);

            });

        } catch (error) {

            console.error("Error loading members:", error);

        }

    }


    // DELETE MEMBER
    async function deleteMember(id) {

        if (!confirm("Are you sure you want to delete this member?")) {
            return;
        }

        try {

            const response = await fetch("/members/" + id, {
                method: "DELETE"
            });

            const data = await response.json();

            console.log(data);

            loadMembers();

        } catch (error) {

            console.error("Error deleting member:", error);

        }

    }


    // LOAD MEMBERS WHEN PAGE OPENS
    loadMembers();

</script>

</body>

</html>
